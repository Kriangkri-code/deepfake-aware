<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ | รู้ทัน Deepfake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-title"><div class="container"><small>บทที่ 5</small><h1>📝 แบบทดสอบ (Quiz)</h1></div></div>
<main class="container">
  <p>แบบทดสอบ 7 ข้อ ครอบคลุม 3 มิติ ได้แก่ <span class="tag">กฎหมาย</span><span class="tag">จริยธรรม</span><span class="tag">ความปลอดภัย</span> และมีคำถามจากสถานการณ์ 2 ข้อ เมื่อตอบครบแล้วกด "ตรวจคำตอบ" เพื่อดูคะแนนและเฉลยรายข้อ</p>
  <div id="quiz" style="margin-top:20px"></div>
  <div id="score" class="score"></div>
  <p style="text-align:center">
    <button id="submitQuiz" class="btn">✔ ตรวจคำตอบ</button>
    <button id="resetQuiz" class="btn secondary">↺ ทำใหม่</button>
  </p>
</main>
<script src="main.js"></script>
</body>
</html>
